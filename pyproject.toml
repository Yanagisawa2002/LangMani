[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "langmani"
version = "0.1.0"
description = "Language-conditioned robotic manipulation research infrastructure."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gymnasium==1.2.3",
    "h5py==3.16.0",
    "lerobot[dataset]==0.6.0",
    "mani-skill==3.0.1",
    "numpy==2.2.6",
    "Pillow==12.3.0",
    "torch==2.11.0",
]

[project.optional-dependencies]
dev = [
    "build==1.3.0",
    "pytest==8.4.2",
    "ruff==0.15.21",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"langmani.policies" = ["m42_schedules/*.json"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "fixture: uses generated local data and never counts as physical validation",
    "gpu: requires native Linux and a working NVIDIA CUDA device",
    "integration: crosses package or simulator boundaries",
    "linux: requires a native Linux runtime",
    "rendering: requires a working Vulkan-backed ManiSkill renderer",
    "slow: performs a long-running collection, export, or validation workflow",
    "target: requires an explicitly provisioned native Linux target runtime",
    "training: executes a real policy optimization path",
    "evaluation: executes learned-policy evaluation behavior",
    "video: encodes or decodes video through the installed PyAV stack",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "SIM", "UP"]
